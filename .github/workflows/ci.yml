name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      # TODO before 1.0: pin third-party actions to commit SHAs (ARCHITECTURE.md §38).
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Build first: the CLI and web packages typecheck against core's built declarations.
      - run: pnpm build
      - run: pnpm typecheck
      # Includes the real-browser test. ubuntu-latest ships Chrome; the test skips loudly without one.
      - run: pnpm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

  package-smoke:
    name: Published package works from a clean install
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The published artifact is ONE self-contained package (core and web are bundled into it), so
      # test exactly that: pack it, install only the tarball into an empty folder, and use it.
      - name: Pack, install the tarball in an empty folder, run the whole flow
        run: |
          set -euo pipefail
          tarballs="$(mktemp -d)"
          pnpm --filter developer-footprint pack --pack-destination "$tarballs"
          work="$(mktemp -d)"; cd "$work"
          npm init -y >/dev/null; npm pkg set type=module >/dev/null
          npm install "$tarballs"/developer-footprint-*.tgz
          df() { npx --no-install developer-footprint "$@"; }
          df --version
          mkdir project && cd project
          df init --type person --name Sarah --url https://sarah.example \
            --project-name MyCoolApp --project-url https://mycoolapp.example --role creator
          df keygen --key-dir "$work/keys"
          df sign --key-dir "$work/keys"
          df verify
          df export --out site --badge
          test -f site/.well-known/developer-footprint/footprint.sig
          test -f site/developer-footprint/badge.js
          cd "$work"
          node --input-type=module -e "
            const sdk = await import('developer-footprint');
            const web = await import('developer-footprint/web');
            if (typeof sdk.verifyFootprint !== 'function' || typeof web.loadAndVerify !== 'function') process.exit(1);
            console.log('SDK and web entry points load');"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
