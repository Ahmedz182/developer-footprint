# Publishes the `developer-footprint` package to npm.
#
# ONE package is published: `developer-footprint` (the CLI, the SDK and the website badge together).
# packages/core and packages/web are private workspace packages that get bundled into it at build
# time (tooling/assemble-package.mjs). There is no npm organization to create.
#
# HOW TO USE (one-time setup, then a tag per release)
#
#  1. Create the token. npmjs.com -> your avatar -> Access Tokens -> Generate New Token ->
#     "Granular Access Token":
#       - Name:        github-actions-developer-footprint
#       - Expiration:  short (30-90 days). You will rotate it; that is the point.
#       - Permissions: Packages and scopes -> "Read and write".
#       - Scope:       choose "All packages" for the FIRST release: the name `developer-footprint`
#                      does not exist on npm yet, and a token limited to named packages cannot
#                      create it. Afterwards replace it with a token limited to `developer-footprint`.
#       - CI cannot type a one-time code, so the token must be allowed to publish without one (the
#                      "bypass two-factor authentication" option). npm is tightening those tokens,
#                      so treat this as a stepping stone to Trusted Publishing (step 6).
#     Copy the token. npm shows it once.
#
#  2. Add it to GitHub as a secret named exactly NPM_TOKEN: either a repository secret, or an
#     environment secret on an environment named "npm" (optionally with a required reviewer so each
#     release needs a click). Never put the token in the repository, a workflow file, or an issue.
#
#  3. Dry run. Actions -> Release -> Run workflow (leave "dry run" ticked). It checks the token with
#     `npm whoami` (so a green dry run means the secret works), runs every check, packs the
#     package, installs the tarball into an empty folder and runs it, and does
#     `npm publish --dry-run`. Nothing is published.
#
#  4. Release. Make sure every packages/*/package.json has the same version, merge to main, then:
#         git tag v0.1.0 && git push origin v0.1.0
#     The tag must equal the package version (a mismatch fails the run). A version that is already
#     on npm is skipped, so a failed run can be safely re-run.
#
#  5. Verify. `npm view developer-footprint version` and, in an empty folder,
#     `npx developer-footprint --version`.
#
#  6. Later (recommended): npm Trusted Publishing lets this workflow publish with NO stored token.
#     On npmjs.com, open the package -> Settings -> Trusted Publisher -> GitHub Actions, and enter
#     this repository, the workflow file name `release.yml` and (if you use one) the environment
#     `npm`. Then delete the NPM_TOKEN secret and revoke the token. (Needs npm CLI >= 11.5.1 here.)
#
# Provenance: for a PUBLIC repository the package is published with a provenance statement linking
# it to this exact commit and workflow run. It is skipped automatically for a private repository.
#
# ARCHITECTURE.md section 56: releases come from CI, not from a laptop.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and pack everything, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance, and npm Trusted Publishing later

concurrency:
  group: release
  cancel-in-progress: false # never cancel a release half-way

jobs:
  release:
    name: Verify, pack and publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      # TODO before 1.0: pin third-party actions to commit SHAs (ARCHITECTURE.md section 38).
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Fails fast, before anything is built or published, if the secret is missing, expired or
      # revoked. Runs on dry runs too, so a green dry run proves the token really works.
      # `npm whoami` prints the account name only; GitHub masks the token itself in logs.
      - name: Check npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set. Follow the steps at the top of .github/workflows/release.yml."
            exit 1
          fi
          echo "Authenticated to npm as: $(npm whoami)"

      - name: Check the release version
        id: version
        run: node tooling/check-release.mjs

      - name: Format, lint, build, typecheck, test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          pnpm format:check
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test

      # pnpm packs (it resolves the workspace metadata correctly), then npm publishes the exact
      # tarball that was inspected and smoke-tested below.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          pnpm --filter developer-footprint pack --pack-destination "$RUNNER_TEMP/tarballs"
          ls -l "$RUNNER_TEMP/tarballs"

      - name: Show what would ship, and check it is self-contained
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/tarballs/developer-footprint-$VERSION.tgz"
          tar -tzf "$tgz" | grep -v '\.d\.ts$'
          # Everything the package needs must be inside it. A dependency on an unpublished
          # workspace package would make it uninstallable.
          for required in dist/bin.js dist/index.js dist/core/index.js dist/web/index.js dist/browser/badge.js; do
            tar -tzf "$tgz" "package/$required" >/dev/null
          done
          tar -xzOf "$tgz" package/package.json | node -e "
            let s=''; process.stdin.on('data', d => s += d).on('end', () => {
              const deps = Object.keys(JSON.parse(s).dependencies ?? {});
              if (deps.length) { console.error('published package must have no runtime dependencies, found: ' + deps); process.exit(1); }
            });"

      - name: Install the tarball in an empty folder and run it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; cd "$work"
          npm init -y >/dev/null; npm pkg set type=module >/dev/null
          npm install "$RUNNER_TEMP/tarballs/developer-footprint-$VERSION.tgz"
          npx --no-install developer-footprint --version
          node --input-type=module -e "
            const sdk = await import('developer-footprint');
            const web = await import('developer-footprint/web');
            if (typeof sdk.verifyFootprint !== 'function' || typeof web.loadAndVerify !== 'function') process.exit(1);
            console.log('SDK and web entry points load');"

      - name: Dry run publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: |
          npm publish "$RUNNER_TEMP/tarballs/developer-footprint-$VERSION.tgz" --dry-run --access public --tag "$NPM_TAG"

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set. Follow the steps at the top of .github/workflows/release.yml."
            exit 1
          fi
          if npm view "developer-footprint@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::developer-footprint@$VERSION is already on npm; nothing to do"
            exit 0
          fi
          flags=(--access public --tag "$NPM_TAG")
          if [ "$REPO_IS_PRIVATE" = "false" ]; then flags+=(--provenance); fi
          echo "Publishing developer-footprint@$VERSION (tag: $NPM_TAG)"
          npm publish "$RUNNER_TEMP/tarballs/developer-footprint-$VERSION.tgz" "${flags[@]}"
