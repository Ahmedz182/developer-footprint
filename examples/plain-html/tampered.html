<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyCoolApp: tampered demo</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          17px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 4rem 1.25rem;
      }
      h1 {
        font-size: 2.2rem;
        margin: 0 0 0.25rem;
      }
      .tag {
        color: GrayText;
        margin: 0 0 2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MyCoolApp</h1>
      <p class="tag">Demo: someone changed a contributor's role to "owner" after it was signed.</p>
      <developer-footprint-badge
        src="/tampered/"
        identity="/.well-known/developer-footprint.json"
      ></developer-footprint-badge>
    </main>
    <script type="module" src="/developer-footprint/badge.js"></script>
  </body>
</html>
